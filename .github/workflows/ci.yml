name: ci
on:
  push:
    branches: [main]
  pull_request:
  # govulncheck also needs to see advisories published between merges.
  schedule:
    - cron: "0 4 * * 1"
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Removal needs config-based git hooks, which only a recent git has.
      - name: Newest git (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install -y git lsof
      - name: Newest git (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install git || brew upgrade git
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - run: git --version
      - name: Lint and format (.golangci.yml)
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Test (unit and integration)
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1
