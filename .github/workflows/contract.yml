name: contract
# Real git against the fixture repository: proves the recorded outputs in
# internal/conn/testdata still match what the newest git prints.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "internal/conn/**"
      - ".github/workflows/contract.yml"
permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Newest git (git-core PPA)
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install -y git lsof
          git --version
      - name: Contract tests
        run: go test -tags contract -count=1 -v -run Contract ./internal/conn
      - name: Integration tests against the same git
        run: go test -count=1 -run E2E .
